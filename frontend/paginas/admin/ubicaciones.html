<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ubicaciones | ELARIS</title>
    <link rel="icon" type="image/png" href="../../imagenes/logo-dorado.png">

    <link rel="stylesheet" href="../../css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 15px;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #666;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 2px solid #f0f0f0;
        }

        .btn-cancelar {
            background: #e0e0e0;
            color: #333;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn-guardar {
            background: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn-guardar:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <a class="navbar-logo" href="dashboardadmin.html">
            <img src="../../imagenes/logo-dorado.png" alt="ELARIS" height="80">
        </a>

        <div class="navbar-right">
            <div class="navbar-perfil" id="perfilDropdown">
                <div class="perfil-trigger">
                    <div class="avatar">--</div>
                    <span>Cargando...</span>
                </div>
                <ul class="dropdown" id="perfilMenu">
                    <li><a href="#">Mi Perfil</a></li>
                    <li><a href="#" class="cerrar-sesion">Cerrar Sesión</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="app-container">

        <aside class="sidebar">
            <div class="sidebar-menu">
                <a href="dashboardadmin.html" class="menu-item">
                    <span class="menu-icono"><i class="fas fa-chart-line"></i></span>
                    <span class="menu-texto">Dashboard</span>
                </a>
                <a href="vuelos.html" class="menu-item">
                    <span class="menu-icono"><i class="fas fa-plane"></i></span>
                    <span class="menu-texto">Vuelos</span>
                </a>
                <a href="paquetes.html" class="menu-item">
                    <span class="menu-icono"><i class="fas fa-box"></i></span>
                    <span class="menu-texto">Paquetes</span>
                </a>
                <a href="ubicaciones.html" class="menu-item active">
                    <span class="menu-icono"><i class="fas fa-map-marker-alt"></i></span>
                    <span class="menu-texto">Ubicaciones</span>
                </a>
            </div>
        </aside>

        <main class="contenido-principal">

            <div class="saludo">
                <h2><i class="fas fa-map-marker-alt"></i> Gestión de Ubicaciones</h2>
                <p>Configura los destinos y aeropuertos del sistema</p>
            </div>

            <div class="glass-card search-container">
                <div class="search-wrapper">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchUbicaciones" placeholder="Buscar por ciudad, país o aeropuerto...">
                    <button class="btn-premium" id="btnAgregarUbicacion">
                        <i class="fas fa-plus"></i> Agregar Ubicación
                    </button>
                </div>
            </div>

            <div class="glass-card">
                <div class="card-header-premium">
                    <h3><i class="fas fa-globe-americas"></i> Destinos Configurados</h3>
                </div>

                <div class="tabla-contenedor">
                    <table class="tabla-premium" id="tablaUbicaciones">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Ciudad</th>
                                <th>País</th>
                                <th>Aeropuerto</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="bodyTablaUbicaciones">
                            <tr>
                                <td colspan="5" style="text-align: center;">
                                    <i class="fas fa-spinner fa-spin"></i> Cargando ubicaciones...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>

    <div id="modalUbicacion" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitulo">Agregar Ubicación</h2>
                <button class="modal-close" onclick="cerrarModal('modalUbicacion')">&times;</button>
            </div>

            <form id="formUbicacion">
                <div class="form-group">
                    <label for="ciudad">Ciudad *</label>
                    <input type="text" id="ciudad" required placeholder="Ej: Bogotá">
                </div>

                <div class="form-group">
                    <label for="pais">País *</label>
                    <input type="text" id="pais" required placeholder="Ej: Colombia">
                </div>

                <div class="form-group">
                    <label for="aeropuerto">Aeropuerto *</label>
                    <input type="text" id="aeropuerto" required placeholder="Ej: El Dorado (BOG)">
                </div>

                <div class="form-group">
                    <label for="codigoAeropuerto">Código Aeropuerto *</label>
                    <input type="text" id="codigoAeropuerto" required placeholder="Ej: BOG">
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-cancelar" onclick="cerrarModal('modalUbicacion')">Cancelar</button>
                    <button type="submit" class="btn-guardar">Guardar Ubicación</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../../js/admi/admin-comun.js"></script>
    <script src="../../js/admin/ubicaciones.js"></script>

</body>

</html>
