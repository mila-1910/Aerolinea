<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitudes de Clientes | ELARIS</title>
    <link rel="icon" type="image/png" href="../../imagenes/logo-dorado.png">

    <!-- CSS ESPECÍFICO DEL AGENTE -->
    <link rel="stylesheet" href="../../css/agente.css">

    <!-- FONT AWESOME -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

</head>

<body>

    <nav class="navbar">
        <a class="navbar-logo" href="dashboardeagente.html">
            <img src="../../imagenes/logo-dorado.png" alt="ELARIS" height="80">
        </a>

        <div class="navbar-right">
            <div class="navbar-perfil" id="perfilDropdown">
                <div class="perfil-trigger">
                    <div class="avatar">AG</div>
                    <span>Agente</span>
                </div>
                <ul class="dropdown" id="perfilMenu">
                    <li><a href="#">Mi Perfil</a></li>
                    <li><a href="#" class="cerrar-sesion">Cerrar Sesión</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="app-container">

        <aside class="sidebar">
            <div class="sidebar-menu">
                <a href="dashboardeagente.html" class="menu-item">
                    <span class="menu-icono"><i class="fas fa-chart-line"></i></span>
                    <span class="menu-texto">Panel de Agente</span>
                </a>
                <a href="reservas.html" class="menu-item">
                    <span class="menu-icono"><i class="fas fa-clipboard-list"></i></span>
                    <span class="menu-texto">Gestionar Reservas</span>
                </a>
                <a href="solicitudes.html" class="menu-item active">
                    <span class="menu-icono"><i class="fas fa-headset"></i></span>
                    <span class="menu-texto">Solicitudes</span>
                </a>
                            <a href="reportes.html" class="menu-item">
                    <span class="menu-icono"><i aria-hidden="true" class="fas fa-chart-bar"></i></span>
                    <span class="menu-texto">Reportes</span>
                </a>
            </div>
        </aside>

        <main class="contenido-principal">

            <div class="saludo">
                <div class="saludo-texto">
                    <h2>Solicitudes de Clientes</h2>
                    <p>Lista de solicitudes recibidas y herramientas para responderlas.</p>
                </div>
                <div style="margin-left:auto; align-self:center;">
                    <button class="btn-buscar" id="btnNuevo">Nuevo</button>
                </div>
            </div>

            <div class="seccion-reservas">
                <div class="seccion-header">
                    <h3><i class="fas fa-table"></i> Listado de Solicitudes</h3>
                    <span class="total-registros" id="totalRegistros">Cargando...</span>
                </div>

                <div class="tabla-responsive">
                    <table class="tabla-reservas-agente" id="tablaSolicitudes">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Cliente</th>
                                <th>Tipo</th>
                                <th>Prioridad</th>
                                <th>Estado</th>
                                <th>Fecha</th>
                                <th>Reserva</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="cuerpoTabla">
                            <!-- Rellenado por JS -->
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>

    <script src="../../js/agente/agente-comun.js"></script>
    <script src="../../js/agente/solicitudes.js"></script>

</body>

</html>
